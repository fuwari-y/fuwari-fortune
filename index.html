/* A burst of magical light when the tarot card turns. */

<header><div class="line">✧</div><h1>夢咲ふわりの<br>魔法の書斎</h1><p class="sub">迷い込んだあなたへ、小さな幸運を。<br>今夜はどんな魔法に出会えるでしょう？</p></header><nav class="menu" aria-label="占いを選択"><button class="active" id="btn-lucky" onclick="switchPanel('lucky')">✧ ラッキー占い</button><button id="btn-tarot" onclick="switchPanel('tarot')">☾ タロット占い</button></nav><section class="panel" id="lucky"><h2>幸運のしおり</h2><p>本をひらくように、今日の物語をひとつ。<br>あなたのラッキーアイテムを見つけましょう。</p><div class="lucky-book-stage" id="lucky-book-stage" aria-hidden="true"><div class="lucky-book-cover"></div><div class="lucky-page left"></div><div class="lucky-page right"></div><div class="lucky-book-spine"></div><div class="lucky-turn-page"></div></div><button class="primary" onclick="drawLucky()">✧ 幸運のしおりを引く</button><div id="lucky-result" class="result hidden" aria-live="polite"></div></section><section class="panel hidden" id="tarot"><h2>月明かりのタロット</h2><p>心に問いをひとつ浮かべて、カードを引いてね。<br>今日のあなたへのメッセージをお届けします。</p><div class="tarot-stage" id="tarot-stage"><div class="magic-burst" aria-hidden="true"></div><div class="tarot-card" id="tarot-card" aria-hidden="true"><div class="tarot-card-inner"><div class="tarot-face tarot-back"><span class="tarot-moon">☾</span></div><div class="tarot-face tarot-front"><span class="tarot-front-star">✦</span><span class="tarot-front-number" id="tarot-front-number">0</span><span class="tarot-front-title" id="tarot-front-title">愚者</span></div></div></div><span class="reveal-star st1" aria-hidden="true">✦</span><span class="reveal-star st2" aria-hidden="true">✧</span><span class="reveal-star st3" aria-hidden="true">✦</span><span class="reveal-star st4" aria-hidden="true">✧</span><span class="reveal-star st5" aria-hidden="true">✧</span></div><button class="primary" onclick="drawTarot()">☾ カードを1枚引く</button><div id="tarot-result" class="result hidden" aria-live="polite"></div></section><footer>✦ YUMESAKI FUWARI ✦<br>この占いはエンターテインメントとしてお楽しみください。<br>※ このページは公開前のデザイン試作版です。</footer></main><script>
function switchPanel(kind){for(const k of ['lucky','tarot']){document.getElementById(k).classList.toggle('hidden',k!==kind);document.getElementById('btn-'+k).classList.toggle('active',k===kind)}}
const colors=["ローズピンク","ベビーピンク","サクラピンク","コーラルピンク","サーモンピンク","ピーチピンク","ダスティピンク","フューシャピンク","マゼンタ","ラズベリーピンク","チェリーピンク","シェルピンク","パウダーピンク","スモーキーローズ","ローズベージュ","ワインレッド","ボルドー","ルビーレッド","ガーネットレッド","スカーレット","カーマイン","ストロベリーレッド","テラコッタ","バーミリオン","アプリコット","コーラルオレンジ","マンダリンオレンジ","アンバー","キャラメル","ハニーゴールド","マリーゴールド","サンフラワーイエロー","レモンイエロー","クリームイエロー","バターイエロー","シャンパンゴールド","パールゴールド","サンドベージュ","アイボリー","バニラホワイト","パールホワイト","スノーホワイト","ミルクホワイト","シルバーグレー","ミストグレー","スモーキーグレー","チャコールグレー","ブラック","ミッドナイトブルー","ネイビーブルー","ロイヤルブルー","サファイアブルー","コバルトブルー","ウルトラマリン","マリンブルー","スカイブルー","ベビーブルー","アイスブルー","ペールブルー","アクアブルー","ターコイズブルー","シアンブルー","ティールブルー","ブルーグレー","デニムブルー","インディゴ","ラベンダー","ライラック","ウィステリア","藤色","オーキッド","モーブ","アメジスト","バイオレット","プラムパープル","グレープパープル","ミッドナイトパープル","ミントグリーン","ペパーミント","セージグリーン","ピスタチオグリーン","ライムグリーン","アップルグリーン","エメラルドグリーン","ジェイドグリーン","モスグリーン","オリーブグリーン","フォレストグリーン","ピーコックグリーン","ミルクティーベージュ","カフェオレ","モカブラウン","ココアブラウン","チョコレートブラウン","シナモンブラウン","コッパー","ブロンズ","ローズゴールド","オパールホワイト","ムーンストーンブルー"];const items=["リボン","小さな鍵","お気に入りの本","手鏡","ハンカチ","宝石のチャーム","マグカップ","しおり","ボールペン","キーホルダー","ヘアクリップ","ヘアゴム","シュシュ","カチューシャ","ブローチ","ネックレス","ブレスレット","指輪","腕時計","懐中時計","ピアス","イヤリング","スカーフ","ストール","帽子","手袋","靴下","トートバッグ","ポーチ","コインケース","お財布","パスケース","名刺入れ","スマホケース","スマホストラップ","イヤホン","手帳","日記帳","メモ帳","付箋","万年筆","色鉛筆","蛍光ペン","消しゴム","ペンケース","クリアファイル","封筒","便箋","シーリングスタンプ","マスキングテープ","シール","ポストカード","写真立て","カレンダー","ブックカバー","文庫本","絵本","ルーペ","小さな鈴","オルゴール","キャンドル","LEDランタン","テーブルライト","砂時計","花瓶","一輪挿し","ドライフラワー","押し花","観葉植物","小さな鉢植え","ぬいぐるみ","クッション","ブランケット","アロマストーン","香り袋","ハンドクリーム","リップクリーム","コンパクトミラー","ヘアブラシ","ネイルオイル","タオル","コースター","ティースプーン","ティーカップ","水筒","ランチボックス","お弁当包み","箸置き","クッキー型","小皿","ガラスの小瓶","ビーズ","ガラス玉","貝殻","天然石","折り紙","小さなノート","エコバッグ","ミニポーチ","星型のチャーム"];const words=['小さな発見が、新しい扉を開いてくれるかも。','焦らず、自分のペースを大切にしてね。','嬉しいことを見つけたら、誰かに伝えてみて。','今日はいつもと違う道に目を向けてみて。','穏やかな時間が、明日の力になりますように。'];const pick=a=>a[Math.floor(Math.random()*a.length)];const bags=new Map();function drawWithoutRepeat(key,values){let bag=bags.get(key);if(!bag||bag.length===0){bag=[...values];for(let j=bag.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[bag[j],bag[k]]=[bag[k],bag[j]]}bags.set(key,bag)}return bag.pop()}function drawLucky(){const n=drawWithoutRepeat('number',Array.from({length:100},(_,i)=>i+1)),c=drawWithoutRepeat('color',colors),i=drawWithoutRepeat('item',items),m=pick(words);const t=`ラッキーナンバー：${n}\nラッキーカラー：${c}\nラッキーアイテム：${i}\n${m}`;const el=document.getElementById('lucky-result');el.innerHTML=`<div class="item"><span>ナンバー</span><strong>${n}</strong></div><div class="item"><span>カラー</span><strong>${c}</strong></div><div class="item"><span>アイテム</span><strong>${i}</strong></div><p class="message">${m}</p><button class="small" id="copy-lucky">結果をコピー</button>`;el.classList.add('hidden');const stage=document.getElementById('lucky-book-stage');stage.classList.remove('turning');void stage.offsetWidth;stage.classList.add('turning');clearTimeout(window.luckyRevealTimer);window.luckyRevealTimer=setTimeout(()=>{el.classList.remove('hidden');document.getElementById('copy-lucky').onclick=()=>copyText(t)},1050)}
const major=['愚者','魔術師','女教皇','女帝','皇帝','教皇','恋人','戦車','力','隠者','運命の輪','正義','吊るされた男','死神','節制','悪魔','塔','星','月','太陽','審判','世界'];
const deck=major.map((name,i)=>({name:`${i}・${name}`,number:i,title:name}));
const majorMessages=['いつもと違う視点が、新しい可能性を運んでくれるかも。','今までの経験が、あなたを優しく支えてくれます。'];
let tarotDrawTimer;
function drawTarot(){
 const card=pick(deck),reverse=Math.random()<.5,m=pick(majorMessages);
 const t=`今日のタロット：${card.name}（${reverse?'逆位置':'正位置'}）\n${m}`;
 const face=document.getElementById('tarot-card'),stage=document.getElementById('tarot-stage'),el=document.getElementById('tarot-result');
 clearTimeout(tarotDrawTimer);
 el.classList.add('hidden');stage.classList.remove('glowing');
 face.classList.remove('is-flipped');
 // Reset without a reverse animation, then perform a single smooth forward flip.
 const inner=face.querySelector('.tarot-card-inner');inner.style.transition='none';void inner.offsetWidth;
 document.getElementById('tarot-front-number').textContent=card.number;
 document.getElementById('tarot-front-title').textContent=card.title;
 inner.style.transition='';void inner.offsetWidth;
 stage.classList.add('glowing');face.classList.add('is-flipped');
 const showResult=()=>{el.innerHTML=`<div style="font-size:24px;color:#f6dfb9;line-height:1.8">${card.name}</div><div style="color:#c8a9d9;font-size:13px">${reverse?'逆位置':'正位置'}</div><p class="message">${m}</p><button class="small" id="copy-tarot">結果をコピー</button>`;el.classList.remove('hidden');document.getElementById('copy-tarot').onclick=()=>copyText(t)};
 tarotDrawTimer=setTimeout(showResult,window.matchMedia('(prefers-reduced-motion: reduce)').matches?30:1100);
}
function copyText(t){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>alert('結果をコピーしました！')).catch(()=>prompt('こちらをコピーしてね',t))}else{prompt('こちらをコピーしてね',t)}}
</script></body></html>
